name: Diagnose testing monitor

on: workflow_dispatch

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_TESTING }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Count testing refresh failures
        shell: bash
        run: |
          umask 077
          entries=$(mktemp)
          trap 'rm -f "$entries"' EXIT
          if ! gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="university-portal-test" AND (httpRequest.requestUrl:"/lms/api/dashboard/pending-assignments?force_refresh=true" OR "GET_OPTIONS_ERROR" OR "NO_SEMESTERS" OR "NO_COURSES" OR "COURSE_FETCH_ERROR" OR "FETCH_ASSIGNMENTS_ERROR" OR "API_PENDING_ASSIGNMENTS_ERROR")' --project unitrack-testing --freshness=1h --limit=200 --format=json > "$entries" 2>/dev/null; then
            echo 'Could not read testing logs.'
            exit 1
          fi
          python - "$entries" <<'PY'
          import json
          import sys
          from collections import Counter

          reasons = (
              'GET_OPTIONS_ERROR', 'NO_SEMESTERS', 'NO_COURSES',
              'COURSE_FETCH_ERROR', 'FETCH_ASSIGNMENTS_ERROR',
              'API_PENDING_ASSIGNMENTS_ERROR',
              'No semesters returned from LMS',
              'University returned a different course',
              'University course context could not be verified',
              'The university assignment table was not recognized',
              'Assignment identities are ambiguous or missing',
              'Failed to save assignments snapshot',
              'Session expired',
              'Request timeout',
          )
          counts = Counter()
          statuses = Counter()
          slow_requests = 0
          with open(sys.argv[1], encoding='utf-8') as handle:
              for entry in json.load(handle):
                  request = entry.get('httpRequest', {})
                  if request:
                      status = request.get('status')
                      if isinstance(status, int) and 100 <= status <= 599:
                          statuses[status] += 1
                      latency = request.get('latency', '')
                      if latency.endswith('s') and float(latency[:-1]) >= 60:
                          slow_requests += 1
                  else:
                      body = json.dumps(entry)
                      counts.update(reason for reason in reasons if reason in body)
          print(json.dumps({
              'request_status_counts': dict(statuses),
              'requests_at_least_60_seconds': slow_requests,
              'error_counts': dict(counts),
          }, sort_keys=True))
          PY
