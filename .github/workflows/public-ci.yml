name: Public synthetic checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      USE_FIRESTORE: 'false'
      SECRET_KEY: synthetic-ci-only-not-for-deployment
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_proxy_transport.py tests/test_release_export.py tests/test_lms_download_security.py tests/test_security_audit_regressions.py
      - run: python -m pytest tests/test_assignment_monitor_repair.py tests/test_discord_reminder_delivery.py tests/test_attendance_notification_retries.py tests/test_scheduled_discord_filter.py tests/test_lms_dashboard_api_integration.py
      - run: node --test tests/js/*.test.cjs
      - name: Verify build context excludes local secrets and runtime data
        run: |
          mkdir -p app/data .cache
          for file in .env .dev.vars serviceAccountKey.json gha-creds-synthetic.json app/data/release-sentinel .cache/release-sentinel; do
            printf 'synthetic-context-probe\n' > "$file"
          done
          docker build --tag lmsplus-context-check .
          docker run --rm --entrypoint python lmsplus-context-check -c "from pathlib import Path; paths=['.env','.dev.vars','serviceAccountKey.json','gha-creds-synthetic.json','app/data/release-sentinel','.cache/release-sentinel']; assert not any((Path('/app') / p).exists() for p in paths), 'Private build-context path leaked'; print('Secret/runtime context exclusions verified')"
