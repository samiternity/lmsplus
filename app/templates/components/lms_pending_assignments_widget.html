<script>
(function() {
    'use strict';

    const widgetState = {
        isLoading: false,
        isRefreshing: false,
        autoRefreshInterval: null,
        countdownInterval: null,
        lastRefreshTime: null,
        data: null
    };

    const elements = {
        loading: document.getElementById('widgetLoading'),
        error: document.getElementById('widgetError'),
        empty: document.getElementById('widgetEmpty'),
        content: document.getElementById('widgetContent'),
        summaryCards: document.getElementById('widgetSummaryCards'),
        pendingCount: document.getElementById('pendingCount'),
        urgentCount: document.getElementById('urgentCount'),
        missedCount: document.getElementById('missedCount'),
        pendingList: document.getElementById('pendingList'),
        missedList: document.getElementById('missedList'),
        pendingSection: document.getElementById('pendingSection'),
        missedSection: document.getElementById('missedSection'),
        headerAgeIndicator: document.getElementById('assignmentsAgeIndicator'),
        headerAgeIcon: document.getElementById('assignmentsAgeIcon'),
        headerAgeText: document.getElementById('assignmentsAgeText'),
        headerRefreshToggle: document.getElementById('refreshDataToggle')
    };

    let progressInterval = null;
    let currentDisplayPct = 0;

    function startProgressTicker() {
        stopProgressTicker();
        currentDisplayPct = 5;

        const pill = elements.headerAgeIndicator || document.getElementById('assignmentsAgeIndicator');
        const textEl = elements.headerAgeText || document.getElementById('assignmentsAgeText');
        const iconEl = elements.headerAgeIcon || document.getElementById('assignmentsAgeIcon');

        if (pill) {
            pill.classList.remove('is-success', 'is-error');
            pill.classList.add('is-syncing');
        }
        if (iconEl) {
            iconEl.className = 'far fa-clock assignments-age-icon';
        }
        if (textEl) {
            textEl.textContent = `Syncing ${currentDisplayPct}%`;
        }

        // Ambient dimming on existing content (Stale-While-Revalidate)
        const summaryCards = elements.summaryCards || document.getElementById('widgetSummaryCards');
        if (summaryCards) summaryCards.classList.add('is-refreshing-content');
        if (elements.content) elements.content.classList.add('is-refreshing-content');
        if (elements.empty) elements.empty.classList.add('is-refreshing-content');

        const startTime = Date.now();
        // Non-linear monotonic progression tuned for 10-15s pace:
        // ~20% at 1.5s, ~50% at 4s, ~70% at 7s, ~84% at 11s, ~90% at 14s, asymptotic cap at 93%
        progressInterval = setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000;
            const targetPct = Math.min(93, Math.round(94 * (1 - Math.exp(-elapsed / 5.2))));
            if (targetPct > currentDisplayPct) {
                currentDisplayPct = targetPct;
                if (textEl && pill && pill.classList.contains('is-syncing')) {
                    textEl.textContent = `Syncing ${currentDisplayPct}%`;
                }
            }
        }, 100);
    }

    function stopProgressTicker() {
        if (progressInterval) {
            clearInterval(progressInterval);
            progressInterval = null;
        }
        const summaryCards = elements.summaryCards || document.getElementById('widgetSummaryCards');
        if (summaryCards) summaryCards.classList.remove('is-refreshing-content');
        if (elements.content) elements.content.classList.remove('is-refreshing-content');
        if (elements.empty) elements.empty.classList.remove('is-refreshing-content');
    }

    function completeProgressSuccess() {
        stopProgressTicker();
        const pill = elements.headerAgeIndicator || document.getElementById('assignmentsAgeIndicator');
        const textEl = elements.headerAgeText || document.getElementById('assignmentsAgeText');
        const iconEl = elements.headerAgeIcon || document.getElementById('assignmentsAgeIcon');

        if (pill) {
            pill.classList.remove('is-syncing', 'is-error');
            pill.classList.add('is-success');
        }
        if (iconEl) {
            iconEl.className = 'fas fa-check assignments-age-icon';
        }
        if (textEl) {
            textEl.textContent = '100%';
        }

        setTimeout(() => {
            if (pill) {
                pill.classList.remove('is-success');
            }
            if (iconEl) {
                iconEl.className = 'far fa-clock assignments-age-icon';
            }
            updateAgeIndicator(true);
        }, 420);
    }

    function completeProgressError(statusLabel = 'Sync failed', isRateLimited = false) {
        stopProgressTicker();
        const pill = elements.headerAgeIndicator || document.getElementById('assignmentsAgeIndicator');
        const textEl = elements.headerAgeText || document.getElementById('assignmentsAgeText');
        const iconEl = elements.headerAgeIcon || document.getElementById('assignmentsAgeIcon');

        if (pill) {
            pill.classList.remove('is-syncing', 'is-success');
            pill.classList.add('is-error');
        }
        if (iconEl) {
            iconEl.className = isRateLimited ? 'fas fa-hourglass-half assignments-age-icon' : 'fas fa-exclamation-triangle assignments-age-icon';
        }
        if (textEl) {
            textEl.textContent = statusLabel;
        }

        setTimeout(() => {
            if (pill) pill.classList.remove('is-error');
            if (iconEl) iconEl.className = 'far fa-clock assignments-age-icon';
            updateAgeIndicator(true);
        }, 1800);
    }

    function triggerCountBump(el) {
        if (!el) return;
        el.classList.remove('count-bump');
        void el.offsetWidth;
        el.classList.add('count-bump');
    }

    function init() {
        loadAssignments(false);
        startAutoRefresh();
    }

    // Load assignments data (single round-trip SWR)
    function loadAssignments(forceRefresh = false) {
        if (widgetState.isLoading) return;

        widgetState.isLoading = true;
        if (!widgetState.data) {
            showLoading();
        }

        if (forceRefresh) {
            startProgressTicker();
        }

        // Timer for slow LMS connection warning banner (triggers after 6s of waiting)
        let slowBannerTimer = setTimeout(() => {
            if (widgetState.isLoading && typeof window.showLMSBanner === 'function') {
                window.showLMSBanner(
                    'LMS responding slowly',
                    'LMS+ is on it — just waiting for university servers to answer.',
                    false
                );
            }
        }, 6000);

        const url = forceRefresh 
            ? '/lms/api/dashboard/pending-assignments?force_refresh=true'
            : '/lms/api/dashboard/pending-assignments';

        fetch(url, {
            method: 'GET',
            headers: { 'Accept': 'application/json' },
            credentials: 'same-origin'
        })
        .then(response => {
            if (response.status === 429) {
                return response.json().then(err => {
                    const errObj = new Error(err.error || 'Please wait before refreshing again.');
                    errObj.status = 429;
                    errObj.code = err.error_code;
                    throw errObj;
                });
            }
            if (!response.ok) {
                throw new Error(`Server error: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            widgetState.isLoading = false;

            if (data.success && !data.error && !data.refresh_failed && !data.warning && !(data.failed_courses || []).length) {
                widgetState.data = data;
                widgetState.lastRefreshTime = data.refreshed_at ? new Date(data.refreshed_at) : null;
                renderAssignments(data);

                // Auto-dismiss slow LMS banner if active
                if (typeof window.hideLMSBanner === 'function') {
                    window.hideLMSBanner();
                }

                if (forceRefresh) {
                    completeProgressSuccess();
                    if (typeof window.showFlashMessage === 'function') {
                        window.showFlashMessage('Assignments refreshed successfully!', 'success');
                    }
                } else {
                    updateAgeIndicator();
                }
            } else {
                const message = data.user_message || data.error || 'Could not refresh assignments. Please try again later.';
                if (!widgetState.data && data.using_saved_snapshot &&
                    Array.isArray(data.pending) && Array.isArray(data.missed)) {
                    widgetState.data = data;
                    widgetState.lastRefreshTime = data.refreshed_at ? new Date(data.refreshed_at) : null;
                    renderAssignments(data);
                    updateAgeIndicator(true);
                }
                if (typeof window.showLMSBanner === 'function') {
                    window.showLMSBanner(
                        'Could not refresh assignments',
                        message,
                        true
                    );
                }
                if (forceRefresh) {
                    completeProgressError();
                }
                if (!widgetState.data) {
                    showError(message);
                }
            }
        })
        .catch(error => {
            widgetState.isLoading = false;
            console.error('Error loading assignments:', error);
            const isRateLimited = error.status === 429;

            if (!isRateLimited && typeof window.showLMSBanner === 'function') {
                window.showLMSBanner(
                    'Could not refresh assignments',
                    'Refresh failed. Please try again later.',
                    true
                );
            }

            if (forceRefresh) {
                const statusLabel = {
                    REFRESH_COOLDOWN: 'Cooldown active',
                    REFRESH_DAILY_LIMIT: 'Daily limit reached'
                }[error.code] || (isRateLimited ? 'Refresh limited' : 'Sync failed');
                completeProgressError(statusLabel, isRateLimited);
                if (typeof window.showFlashMessage === 'function') {
                    window.showFlashMessage(error.message || 'Failed to refresh data', 'error');
                }
            }
            if (!widgetState.data) {
                showError(error.message || 'Network error occurred. Please retry.');
            }
        })
        .finally(() => {
            if (slowBannerTimer) {
                clearTimeout(slowBannerTimer);
            }
            resetHeaderRefreshButton();
        });
    }

    // Render assignments to DOM
    function renderAssignments(data) {
        const prevPending = elements.pendingCount ? elements.pendingCount.textContent : '-';
        const prevUrgent = elements.urgentCount ? elements.urgentCount.textContent : '-';
        const prevMissed = elements.missedCount ? elements.missedCount.textContent : '-';

        const newPending = String(data.total_pending || 0);
        const newMissed = String(data.total_missed || 0);

        const newUrgent = String(countUrgentAssignments(data.pending || []));

        if (elements.pendingCount) elements.pendingCount.textContent = newPending;
        if (elements.urgentCount) elements.urgentCount.textContent = newUrgent;
        if (elements.missedCount) elements.missedCount.textContent = newMissed;

        if (prevPending !== '-' && prevPending !== newPending) triggerCountBump(elements.pendingCount);
        if (prevUrgent !== '-' && prevUrgent !== newUrgent) triggerCountBump(elements.urgentCount);
        if (prevMissed !== '-' && prevMissed !== newMissed) triggerCountBump(elements.missedCount);

        const hasAssignments = (data.total_pending > 0) || (data.total_missed > 0);

        if (!hasAssignments) {
            showEmpty();
            return;
        }

        // Render Pending
        if (data.pending && data.pending.length > 0) {
            elements.pendingSection.style.display = 'block';
            elements.pendingList.innerHTML = data.pending.map(a => renderAssignmentItem(a, false)).join('');
        } else {
            elements.pendingSection.style.display = 'none';
        }

        // Render Missed
        if (data.missed && data.missed.length > 0) {
            elements.missedSection.style.display = 'block';
            elements.missedList.innerHTML = data.missed.map(a => renderAssignmentItem(a, true)).join('');
        } else {
            elements.missedSection.style.display = 'none';
        }

        showContent();
    }

    // Render Individual Assignment Card
    function renderAssignmentItem(assignment, isMissed) {
        const deadlineClass = countdownState(assignment);
        const urgencyClass = isMissed ? 'missed' : (deadlineClass === 'normal' ? '' : 'soon');

        // Course Name prominent (No course codes displayed)
        const courseName = assignment.course_name || 'Course Deliverable';

        return `
            <div class="assignment-item ${urgencyClass}">
                <div class="assignment-info">
                    <div class="assignment-course-name">${escapeHtml(courseName)}</div>
                    <div class="assignment-title">${escapeHtml(assignment.title || 'Untitled Assignment')}</div>
                </div>
                ${!isMissed || assignment.total_marks ? `<div class="assignment-meta">
                    ${!isMissed ? `
                    <div class="assignment-deadline-info ${deadlineClass}">
                        <i class="far fa-clock" aria-hidden="true"></i>
                        <span class="assignment-countdown" data-cutoff="${escapeHtml(assignment.deadline_datetime || '')}">${countdownMarkup(assignment)}</span>
                    </div>
                    ` : ''}
                    ${assignment.total_marks ? `
                    <div class="assignment-marks">
                        <i class="fas fa-star"></i>
                        <span>${assignment.total_marks} marks</span>
                    </div>
                    ` : ''}
                </div>` : ''}
            </div>
        `;
    }

    function countdownHours(assignment) {
        const cutoff = Date.parse(assignment.deadline_datetime);
        return Number.isFinite(cutoff)
            ? (cutoff - Date.now()) / 3600000
            : assignment.hours_until_due;
    }

    function countUrgentAssignments(assignments) {
        return assignments.filter(assignment => {
            const hours = countdownHours(assignment);
            return typeof hours === 'number' && Number.isFinite(hours) && hours > 0 && hours <= 24;
        }).length;
    }

    function countdownState(assignment) {
        const hours = countdownHours(assignment);
        if (typeof hours !== 'number' || !Number.isFinite(hours) || hours <= 0 || hours > 24) return 'normal';
        return hours < 3 ? 'urgent' : 'soon';
    }

    function countdownMarkup(assignment) {
        const text = formatDeadline(assignment);
        if (!text.endsWith(' left')) return escapeHtml(text);
        return `<span class="assignment-countdown-value">${escapeHtml(text.slice(0, -5))}</span><span class="assignment-countdown-suffix"> left</span>`;
    }

    // Use the absolute cutoff so countdowns stay current between data refreshes.
    function formatDeadline(assignment) {
        const hours = countdownHours(assignment);
        if (typeof hours !== 'number' || !Number.isFinite(hours)) return 'No deadline';
        if (hours <= 0) return 'Submission closed';
        if (hours < 1 / 60) return 'Less than 1m left';

        // Round down: never suggest students have more time than remains.
        const minutes = Math.floor(hours * 60);
        const days = Math.floor(minutes / 1440);
        const remainingHours = Math.floor(minutes / 60) % 24;
        const remainingMinutes = minutes % 60;
        if (days > 0) return `${days}d${remainingHours ? ` ${remainingHours}h` : ''} left`;
        if (remainingHours > 0) return `${remainingHours}h${remainingMinutes ? ` ${remainingMinutes}m` : ''} left`;
        return `${remainingMinutes}m left`;
    }

    function updateCountdowns() {
        if (elements.urgentCount && widgetState.data) {
            elements.urgentCount.textContent = String(countUrgentAssignments(widgetState.data.pending || []));
        }
        document.querySelectorAll('.assignment-countdown[data-cutoff]').forEach(label => {
            if (!Number.isFinite(Date.parse(label.dataset.cutoff))) return;
            const assignment = {deadline_datetime: label.dataset.cutoff};
            label.innerHTML = countdownMarkup(assignment);
            const state = countdownState(assignment);
            label.parentElement.classList.remove('normal', 'soon', 'urgent');
            label.parentElement.classList.add(state);
            const card = label.closest('.assignment-item');
            if (card && !card.classList.contains('missed')) {
                card.classList.toggle('soon', state !== 'normal');
            }
        });
    }

    // Update Header Age Pill
    function updateAgeIndicator(force = false) {
        if (!force && widgetState.isRefreshing) return;
        const ageTextEl = elements.headerAgeText || document.getElementById('assignmentsAgeText');
        if (!ageTextEl) return;

        if (!widgetState.lastRefreshTime) {
            ageTextEl.textContent = 'Ready';
            return;
        }

        const now = new Date();
        const diff = now - widgetState.lastRefreshTime;
        const minutes = Math.floor(diff / 60000);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);

        if (minutes < 1) {
            ageTextEl.textContent = 'Refreshed just now';
        } else if (minutes < 60) {
            ageTextEl.textContent = `Refreshed ${minutes}m ago`;
        } else if (hours < 24) {
            ageTextEl.textContent = `Refreshed ${hours}h ago`;
        } else {
            ageTextEl.textContent = `Refreshed ${days}d ago`;
        }
    }

    function resetHeaderRefreshButton() {
        const btn = elements.headerRefreshToggle || document.getElementById('refreshDataToggle');
        if (btn) {
            btn.classList.remove('is-refreshing');
            btn.disabled = false;
        }
        widgetState.isRefreshing = false;
    }

    // Global refresh trigger (Called from top-right header button)
    window.refreshAssignments = function() {
        if (widgetState.isRefreshing || widgetState.isLoading) return;

        const btn = elements.headerRefreshToggle || document.getElementById('refreshDataToggle');
        if (btn) {
            btn.classList.add('is-refreshing');
            btn.disabled = true;
        }
        widgetState.isRefreshing = true;
        loadAssignments(true);
    };

    window.reloadPendingAssignmentsWidget = function() {
        loadAssignments(false);
    };

    function startAutoRefresh() {
        widgetState.countdownInterval = setInterval(updateCountdowns, 30000);
        setInterval(updateAgeIndicator, 60000);
        widgetState.autoRefreshInterval = setInterval(() => {
            if (!widgetState.isLoading && !widgetState.isRefreshing) {
                loadAssignments(false);
            }
        }, 300000);
    }

    function showLoading() {
        elements.loading.style.display = 'block';
        elements.error.style.display = 'none';
        elements.empty.style.display = 'none';
        elements.content.style.display = 'none';
    }

    function showError(message) {
        elements.loading.style.display = 'none';
        elements.error.style.display = 'block';
        elements.empty.style.display = 'none';
        elements.content.style.display = 'none';
        const msgEl = document.getElementById('errorMessage');
        if (msgEl) msgEl.textContent = message;
    }

    function showEmpty() {
        elements.loading.style.display = 'none';
        elements.error.style.display = 'none';
        elements.empty.style.display = 'flex';
        elements.content.style.display = 'none';
    }

    function showContent() {
        elements.loading.style.display = 'none';
        elements.error.style.display = 'none';
        elements.empty.style.display = 'none';
        elements.content.style.display = 'block';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    window.addEventListener('beforeunload', () => {
        clearInterval(widgetState.countdownInterval);
        if (widgetState.autoRefreshInterval) {
            clearInterval(widgetState.autoRefreshInterval);
        }
    });
})();
</script>
